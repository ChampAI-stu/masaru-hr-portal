<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASARU HR — ระบบคำขอลา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#EEEEEA; --panel:#FFFFFF; --ink:#101F36; --navy:#1B2D51; --orange:#D42027;
  --muted:#7A8398; --line:#E3E3DC;
  --present:#2E9E6B; --late:#E8912A; --absent:#D8453A; --vacation:#2E93C4; --sick:#C24D6B; --personal:#6B6FCB;
  --shadow:0 1px 2px rgba(16,31,54,.06),0 8px 24px rgba(16,31,54,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}

/* ===== Topbar (ตาม chack.html) ===== */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:60;border-bottom:3px solid var(--orange)}
.topbar-in{max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand .mark{width:auto;height:34px;flex:none}
.brand .t1{font-family:'Anuphan';font-weight:700;font-size:18px;line-height:1;letter-spacing:.02em}
.brand .t2{font-size:12px;color:#AEB8CF;margin-top:4px}
.btn{font-family:inherit;font-size:13.5px;font-weight:600;border-radius:10px;padding:9px 15px;cursor:pointer;border:1px solid transparent;transition:.15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-red{background:var(--orange);color:#fff;border:none}
.btn-red:hover{filter:brightness(1.05)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22)}
.btn-ghost:hover{background:rgba(255,255,255,.2)}

/* ===== Tabbar (ตาม chack.html) ===== */
.tabbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50}
.tabbar-in{max-width:1280px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:14px}
.tabs{display:flex;gap:2px}
.tab{font-family:'Anuphan';font-weight:600;font-size:14.5px;color:#AEB8CF;background:none;border:none;padding:14px 16px 11px;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--orange)}
.tab .n{display:inline-block;min-width:20px;padding:1px 7px;border-radius:99px;background:var(--orange);color:#fff;font-size:11.5px;margin-left:6px}

.wrap{max-width:1280px;margin:0 auto;padding:24px}

/* ===== KPI (ตาม chack.html) ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--navy))}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .dot{width:8px;height:8px;border-radius:3px;background:var(--c,var(--navy))}
.kpi .v{font-family:'Anuphan';font-weight:700;font-size:30px;line-height:1.1;margin-top:6px;color:var(--ink)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* ===== Filter bar ===== */
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar select,.bar input{font-family:inherit;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);outline:none}
.bar input[type=search]{min-width:220px;flex:1}
.btn-line{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--navy)}

/* ===== Table ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{background:var(--navy);color:#fff;font-family:'Anuphan';font-size:13px;font-weight:600;text-align:left;padding:11px 14px;position:sticky;top:0;white-space:nowrap;border-bottom:3px solid var(--orange)}
tbody td{padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tbody tr:hover{background:#F7F7F3}
.mut{color:var(--muted);font-size:12px}
.emp b{font-weight:700}

/* pipeline สถานะ 3 ขั้น */
.pipe{display:flex;align-items:center;white-space:nowrap}
.pipe .st{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#B9C0CC}
.pipe .dot{width:9px;height:9px;border-radius:99px;background:#D9DDD3;border:2px solid #D9DDD3}
.pipe .ln{width:20px;height:2px;background:#D9DDD3;margin:0 5px}
.pipe .st.done{color:var(--present)} .pipe .st.done .dot{background:var(--present);border-color:var(--present)}
.pipe .st.now{color:var(--late)} .pipe .st.now .dot{background:#fff;border-color:var(--late)}
.pipe .st.deny{color:var(--absent)} .pipe .st.deny .dot{background:var(--absent);border-color:var(--absent)}
.pipe.p-done .ln{background:var(--present)}

/* tag ประเภทการลา — สีชุดเดียวกับตารางเช็คชื่อ */
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.t-sick{background:var(--sick)} .t-biz{background:var(--personal)}
.t-vac{background:var(--vacation)} .t-late{background:var(--late)}
.t-abs{background:var(--absent)} .t-etc{background:var(--muted)}
.doc{color:var(--present);font-weight:700}

.act{display:flex;gap:6px;white-space:nowrap}
.mini{padding:6px 12px;font-size:12.5px;border-radius:8px;border:none;color:#fff}
.m-ok{background:var(--present)} .m-bad{background:var(--absent)} .m-ack{background:var(--navy)} .m-doc{background:var(--vacation);padding:4px 9px} .m-deldoc{background:var(--muted)} .m-delreq{background:var(--absent)}
.mini:hover{filter:brightness(1.08)}

.empty{padding:46px;text-align:center;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:8px}
.count{font-size:12.5px;color:var(--muted);margin:10px 2px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;border-bottom:3px solid var(--orange)}
.toast.show{opacity:1}
.setup{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:16px;box-shadow:var(--shadow);padding:22px;max-width:640px;margin:40px auto}
.setup h2{font-family:'Anuphan';font-size:17px;margin-bottom:10px}
.setup code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12.5px}
.setup ol{margin:10px 0 0 20px;line-height:2}
@media(max-width:640px){.topbar-in{padding:12px 14px}.wrap{padding:16px 12px}}

/* ===== Auth gate (แบบเดียวกับหน้าอื่นใน Portal) ===== */
.hide{display:none!important}
body.locked{overflow:hidden}
.auth-gate{position:fixed;inset:0;background:#0e1c38;display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px}
.auth-gate.hide{display:none}
.auth-card{background:#fff;border-radius:18px;padding:30px 28px;width:360px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:'IBM Plex Sans Thai',sans-serif}
.auth-brand{font-weight:800;font-size:20px;color:#1B2D51;text-align:center}
.auth-sub{color:#7A8398;text-align:center;margin:4px 0 18px;font-size:14px}
.auth-fld{margin-bottom:12px}
.auth-fld label{display:block;font-size:12.5px;font-weight:600;color:#1B2D51;margin-bottom:5px}
.auth-fld input{width:100%;border:1px solid #e3e3dc;border-radius:10px;padding:11px 13px;font-family:inherit;font-size:15px;box-sizing:border-box}
.auth-btn{width:100%;background:#D42027;color:#fff;border:none;border-radius:10px;padding:12px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px}
.auth-btn:hover{filter:brightness(1.05)}
.auth-btn:disabled{opacity:.6}
.auth-err{background:#fdecea;color:#c0392b;border-radius:8px;padding:9px 12px;font-size:13px;margin-top:10px}
.auth-err.hide{display:none}
.auth-portal{display:block;text-align:center;margin-top:14px;color:#2E75B6;font-size:13px;text-decoration:none}
.back-home{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;font-family:inherit;font-size:13.5px;text-decoration:none;font-weight:600}
.back-home:hover{background:rgba(255,255,255,.2)}
/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(16,31,54,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
.modal{background:#fff;border-radius:16px;width:410px;max-width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{background:var(--navy);color:#fff;font-family:'Anuphan';font-weight:700;font-size:16px;padding:13px 16px;border-bottom:3px solid var(--orange)}
.modal-b{padding:6px 16px 16px}
.modal-b label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin:12px 0 5px}
.modal-b input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;box-sizing:border-box}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
/* ===== หน้าต่างประวัติแชท ===== */
.chat-modal{background:#fff;border-radius:16px;width:480px;max-width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:82vh}
.chat-body{padding:14px;overflow-y:auto;background:var(--bg);display:flex;flex-direction:column;gap:8px;min-height:200px}
.bub{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bub .bt{font-size:10.5px;color:var(--muted);margin-top:3px}
.bub.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.out{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bub.out .bt{color:#AEB8CF}
</style>

const thD = iso => { if(!iso) return "-"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${(+y+543)%100}`; };
const range = r => (r.date_from===r.date_to ? thD(r.date_from) : `${thD(r.date_from)} - ${thD(r.date_to)}`) + (r.day_part && r.day_part!=="เต็มวัน" ? ` (${r.day_part})` : "");

/* โหลดข้อมูลทั้งหมด (เกิน 1000 แถวก็ครบ ด้วยการแบ่งหน้า) */
async function pageAll(table, orderCol){
  let all=[], from=0, size=1000;
  while(true){
    const {data,error} = await db.from(table).select("*").order(orderCol,{ascending:false}).range(from,from+size-1);
    if(error){ toast("โหลดข้อมูลไม่สำเร็จ: "+error.message); break; }
    all = all.concat(data||[]);
    if(!data || data.length<size) break;
    from += size;
  }
  return all;
}

let emps=[], links=[], apprs=[], regs=[], uq="", adminCode="", showCode=false, lineQuota=null, regCmd="ลงทะเบียน", botName="น้องพลอย";
const BOT_URL = "https://iyycyvnvfmerxkcfalea.supabase.co/functions/v1/dynamic-processor";
async function loadAll(){
  const [a,b,c,d,e,f,g,bn] = await Promise.all([
    pageAll("leave_requests","created_at"),
    db.from("employees").select("*").order("emp_code"),
    db.from("line_users").select("*").order("registered_at",{ascending:false}),

  fetchLineQuota();
  render();
}

function setTab(t){
  tab = t;
  ["pending","all","sum","users"].forEach(x=>document.getElementById("tb-"+x).classList.toggle("on",x===t));
  render();
}

/* ---------- สถานะ pipeline ---------- */
function pipeline(r){
  if(r.status==="cancelled")
    return `<div class="pipe"><span class="st deny"><span class="dot"></span>ยกเลิกโดยพนักงาน</span></div>`;
  const rej = r.status==="rejected";
  const s1 = r.status!=="pending";
  const s2 = !!r.hr_ack_at;
  const st1 = rej ? `<span class="st deny"><span class="dot"></span>ไม่อนุมัติ</span>`
    : s1 ? `<span class="st done"><span class="dot"></span>หัวหน้าอนุมัติ</span>`
    : `<span class="st now"><span class="dot"></span>รอหัวหน้า</span>`;
  const st2 = s2 ? `<span class="st done"><span class="dot"></span>HR รับทราบ</span>`
    : (s1 ? `<span class="st now"><span class="dot"></span>รอ HR</span>` : `<span class="st"><span class="dot"></span>รอ HR</span>`);
  return `<div class="pipe ${s2?'p-done':''}">${st1}<span class="ln"></span>${st2}</div>`;
}

function stage(r){
  if(r.status==="cancelled") return "ยกเลิกโดยพนักงาน";
  if(r.status==="rejected") return r.hr_ack_at ? "ปิดงาน (ไม่อนุมัติ)" : "รอ HR รับทราบ";
  if(r.status==="pending") return "รอหัวหน้าอนุมัติ";
  return r.hr_ack_at ? "ปิดงาน (อนุมัติ)" : "รอ HR รับทราบ";
}

/* ---------- Actions ---------- */
async function act(id, what){
  const label = {approve:"อนุมัติ", reject:"ไม่อนุมัติ", ack:"รับทราบ"}[what];
  if(!confirm(`ยืนยัน "${label}" คำขอ #${id}?\n(การกดจากหน้าเว็บจะไม่ส่งแจ้งเตือน LINE)`)) return;
  let patch;
  if(what==="ack") patch = { hr_ack_by:"HR (เว็บ)", hr_ack_at:new Date().toISOString() };
  else patch = { status: what==="approve"?"approved":"rejected", approved_by:"HR (เว็บ)", approved_at:new Date().toISOString() };
  const {error} = await db.from("leave_requests").update(patch).eq("id",id);
  if(error){ toast("อัปเดตไม่สำเร็จ: "+error.message); return; }
  toast(`${label}คำขอ #${id} เรียบร้อย ✅`);
  await loadAll();
}

/* ---------- ดูไฟล์หลักฐาน ---------- */
async function viewDocs(id){
  const r = rows.find(x=>x.id===id);
  const list = (r && Array.isArray(r.attachments)) ? r.attachments : [];
  if(!list.length){ toast("ไม่มีไฟล์แนบ"); return; }
  for(const p of list){
    const {data, error} = await db.storage.from("leave-docs").createSignedUrl(p, 3600);
    if(error){ toast("เปิดไฟล์ไม่สำเร็จ: "+error.message); return; }
    window.open(data.signedUrl, "_blank");
  }
}

/* ---------- ลบไฟล์แนบ / ลบคำขอ ---------- */
async function delDocs(id){
  const r = rows.find(x=>x.id===id);
  const list = (r && Array.isArray(r.attachments)) ? r.attachments : [];
  if(!list.length){ toast("ไม่มีไฟล์แนบ"); return; }
  if(!confirm(`ลบไฟล์แนบ ${list.length} ไฟล์ ของคำขอ #${id}?\nข้อมูลคำขอยังอยู่ แต่ไฟล์กู้คืนไม่ได้`)) return;
  const {error: se} = await db.storage.from("leave-docs").remove(list);
  if(se){ toast("ลบไฟล์ไม่สำเร็จ: "+se.message); return; }

async function saveEmp(){
  const code = document.getElementById("mCode").value.trim().toUpperCase();
  const name = document.getElementById("mName").value.trim();
  const dept = document.getElementById("mDept").value.trim();
  if(!code || !name || !dept){ toast("กรอกให้ครบทุกช่อง ❌"); return; }
  const qs = parseInt(document.getElementById("mQS").value)||0;
  const qp = parseInt(document.getElementById("mQP").value)||0;
  const qv = parseInt(document.getElementById("mQV").value)||0;
  if(editingCode){
    const {error} = await db.from("employees")
      .update({emp_code:code, emp_name:name, department:dept, quota_sick:qs, quota_personal:qp, quota_vacation:qv}).eq("emp_code", editingCode);
    if(error){ toast("บันทึกไม่สำเร็จ: "+error.message); return; }
    // sync ไปที่การผูก LINE ด้วย (บอทจะใช้ข้อมูลใหม่ทันที)
    await db.from("line_users")
      .update({emp_code:code, emp_name:name, department:dept}).eq("emp_code", editingCode);
  }else{
    const {error} = await db.from("employees").insert({emp_code:code, emp_name:name, department:dept, quota_sick:qs, quota_personal:qp, quota_vacation:qv});
    if(error){ toast("เพิ่มไม่สำเร็จ: "+error.message); return; }
  }
  closeModal(); toast("บันทึกเรียบร้อย ✅"); await loadAll();
}

async function toggleEmp(code){
  const e = emps.find(x=>x.emp_code===code); if(!e) return;
  const to = !e.is_active;
  const msg = to ? `คืนสถานะ "${e.emp_name}" ให้กลับมาใช้งานระบบได้?`
    : `ให้ "${e.emp_name}" พ้นสภาพ?\nระบบจะปลดการผูก LINE ด้วย (แจ้งลาไม่ได้จนกว่าจะคืนสถานะ)`;
  if(!confirm(msg)) return;
  const {error} = await db.from("employees").update({is_active:to}).eq("emp_code", code);
  if(error){ toast("ไม่สำเร็จ: "+error.message); return; }
  if(!to) await db.from("line_users").delete().eq("emp_code", code);
  toast("อัปเดตเรียบร้อย ✅"); await loadAll();
}

async function delEmp(code){

async function regDecide(id, ok){
  const g = regs.find(x=>x.id===id); if(!g) return;
  if(!confirm(`${ok?"ยืนยันตัวตน":"ปฏิเสธ"} "${g.emp_name}" (${g.emp_code})?\n(การกดจากเว็บจะไม่แจ้งเตือน LINE - พนักงานทราบเมื่อลองใช้งาน)`)) return;

      { line_user_id: g.line_user_id, emp_code: g.emp_code, emp_name: g.emp_name, department: g.department },
      { onConflict: "line_user_id" });

  toast(`${ok?"ยืนยัน":"ปฏิเสธ"}เรียบร้อย ✅`);

        ${limit===null
          ? `<span class="tag" style="background:var(--present)">ไม่จำกัด</span>`
          : `<span>ใช้ไป <b>${used.toLocaleString()}</b> / ${limit.toLocaleString()} ข้อความ (เหลือ ${(limit-used).toLocaleString()})</span>`}
        <span class="mut">นับเฉพาะ push (แจ้งหัวหน้า/HR/ผลอนุมัติ) — ข้อความตอบกลับไม่นับ</span>
      </div>
      ${limit!==null?`<div style="margin-top:10px;height:8px;background:var(--bg);border-radius:99px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${barColor};border-radius:99px"></div>
      </div>${pct>=90?'<div style="margin-top:6px;color:var(--absent);font-size:12.5px;font-weight:600">⚠️ ใกล้เต็มโควตา — พิจารณาอัปเกรดแพ็กเกจ OA</div>':""}`:""}
      ${gRow}
    </div>`;
  }

  return codeSec + lineSec + regSec + `
    <div class="bar">
      <input type="search" placeholder="🔍 ค้นหา รหัส / ชื่อ / แผนก" value="${esc(uq)}" oninput="uq=this.value;render()">
      <button class="btn btn-red" onclick="openEmpModal(null)">➕ เพิ่มพนักงาน</button>
      <span class="count">พนักงาน ${emps.length} คน • ผูก LINE แล้ว ${links.length} คน</span>
    </div>
    <div class="card" style="margin-bottom:20px"><table>
      <thead><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>แผนก</th><th>สถานะ</th><th>LINE</th><th>จัดการ</th></tr></thead>
      <tbody>${empRows || '<tr><td colspan="6" class="empty">ไม่พบพนักงาน</td></tr>'}</tbody>
    </table></div>
    <div class="count" style="font-weight:700;color:var(--ink);font-size:14px">👥 ผู้อนุมัติ (หัวหน้าแผนก / HR)</div>
    <div class="card"><table>
      <thead><tr><th>ชื่อ</th><th>บทบาท</th><th>แผนก</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
      <tbody>${apRows}</tbody>
    </table></div>`;
}

/* ---------- Render ---------- */
function tagOf(t){ return `<span class="tag ${TAGC[t]||'t-etc'}">${esc(t)}</span>`; }

function rowHtml(r, mode){
  const withAct = !!mode;
  let actions = "";
  if(mode==="act"){
    if(r.status==="pending")
      actions = `<button class="btn mini m-ok" onclick="act(${r.id},'approve')">✅ อนุมัติ</button>
                 <button class="btn mini m-bad" onclick="act(${r.id},'reject')">❌ ไม่อนุมัติ</button>`;
    else if(!r.hr_ack_at)
      actions = `<button class="btn mini m-ack" onclick="act(${r.id},'ack')">👁 รับทราบ</button>`;
  } else if(mode==="del"){
    const nDocs = (r.attachments||[]).length;
    actions = `${nDocs?`<button class="btn mini m-deldoc" onclick="delDocs(${r.id})" title="ลบเฉพาะไฟล์แนบ คำขอยังอยู่">🗑 ไฟล์ (${nDocs})</button>`:""}
               <button class="btn mini m-delreq" onclick="delReq(${r.id})" title="ลบคำขอทั้งรายการ">🗑 คำขอ</button>`;
  }
  return `<tr>
    <td class="mut">#${r.id}</td>
    <td class="emp"><b>${esc(r.emp_name)}</b><div class="mut">${esc(r.emp_code)} • ${esc(r.department||"-")}</div></td>
    <td>${tagOf(r.leave_type)}</td>
    <td>${range(r)}</td>
    <td>${esc(r.reason||"-")}${(r.attachments&&r.attachments.length)?` <button class="btn mini m-doc" onclick="viewDocs(${r.id})" title="ดูหลักฐาน">📎 ${r.attachments.length}</button>`:(r.has_document?' <span class="doc" title="แจ้งว่ามีเอกสาร แต่ยังไม่ส่งไฟล์">📎รอไฟล์</span>':'')}</td>
    <td>${pipeline(r)}</td>
    <td class="mut">${esc(r.approved_by||"-")}</td>
    ${withAct?`<td><div class="act">${actions}</div></td>`:""}
  </tr>`;
}

function table(list, mode){
  if(list.length===0) return `<div class="card"><div class="empty"><div class="big">🎉</div>ไม่มีรายการ</div></div>`;
  return `<div class="card"><table>
    <thead><tr><th>#</th><th>พนักงาน</th><th>ประเภท</th><th>วันที่</th><th>เหตุผล</th><th>สถานะ</th><th>ผู้อนุมัติ</th>${mode?"<th>จัดการ</th>":""}</tr></thead>
    <tbody>${list.map(r=>rowHtml(r,mode)).join("")}</tbody>
  </table></div>`;
}

function kpis(){
  const today = new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Bangkok"});
  const p = rows.filter(r=>r.status==="pending").length;
  const w = rows.filter(r=>r.status!=="pending" && r.status!=="cancelled" && !r.hr_ack_at).length;
  const t = rows.filter(r=>r.date_from<=today && r.date_to>=today && r.status!=="rejected" && r.status!=="cancelled").length;
  document.getElementById("nPending").textContent = p+w;
  const nr = document.getElementById("nRegs");
  nr.textContent = regs.length;
  nr.classList.toggle("hide", regs.length===0);
  return `<div class="kpis">
    <div class="kpi" style="--c:var(--late)"><div class="lab"><span class="dot"></span>รอหัวหน้าอนุมัติ</div><div class="v">${p}</div></div>
    <div class="kpi" style="--c:var(--vacation)"><div class="lab"><span class="dot"></span>รอ HR รับทราบ</div><div class="v">${w}</div></div>
    <div class="kpi" style="--c:var(--present)"><div class="lab"><span class="dot"></span>ลา/สาย มีผลวันนี้</div><div class="v">${t}</div></div>
    <div class="kpi" style="--c:var(--navy)"><div class="lab"><span class="dot"></span>คำขอทั้งหมด</div><div class="v">${rows.length}</div></div>
  </div>`;
}

function filterBar(){
  const depts = [...new Set(rows.map(r=>r.department).filter(Boolean))].sort();
  return `<div class="bar">
    <input type="search" placeholder="🔍 ค้นหาชื่อ / รหัสพนักงาน" value="${esc(F.q)}" oninput="F.q=this.value;render()">
    <select onchange="F.type=this.value;render()">
      <option value="">ทุกประเภท</option>
      ${["ลาป่วย","ลากิจ","ลาพักร้อน","มาสาย","ขาดงาน","อื่นๆ"].map(t=>`<option ${F.type===t?"selected":""}>${t}</option>`).join("")}
    </select>
    <select onchange="F.dept=this.value;render()">
      <option value="">ทุกแผนก</option>
      ${depts.map(d=>`<option ${F.dept===d?"selected":""}>${esc(d)}</option>`).join("")}
    </select>
    <select onchange="F.status=this.value;render()">
      <option value="">ทุกสถานะ</option>
      <option ${F.status==="รอหัวหน้าอนุมัติ"?"selected":""}>รอหัวหน้าอนุมัติ</option>
      <option ${F.status==="รอ HR รับทราบ"?"selected":""}>รอ HR รับทราบ</option>
      <option ${F.status==="ปิดงาน (อนุมัติ)"?"selected":""}>ปิดงาน (อนุมัติ)</option>
      <option ${F.status==="ปิดงาน (ไม่อนุมัติ)"?"selected":""}>ปิดงาน (ไม่อนุมัติ)</option>
      <option ${F.status==="ยกเลิกโดยพนักงาน"?"selected":""}>ยกเลิกโดยพนักงาน</option>
    </select>
    <input type="date" value="${F.from}" onchange="F.from=this.value;render()" title="ตั้งแต่วันที่">
    <input type="date" value="${F.to}" onchange="F.to=this.value;render()" title="ถึงวันที่">
    <button class="btn btn-line" onclick="Object.keys(F).forEach(k=>F[k]='');render()">ล้างตัวกรอง</button>
  </div>`;
}

function applyFilter(list){
  return list.filter(r=>{
    if(F.type && r.leave_type!==F.type) return false;
    if(F.dept && r.department!==F.dept) return false;
    if(F.status && stage(r)!==F.status) return false;
    if(F.from && r.date_to < F.from) return false;
    if(F.to && r.date_from > F.to) return false;
    if(F.q){ const q=F.q.toLowerCase(); if(!(`${r.emp_name} ${r.emp_code}`.toLowerCase().includes(q))) return false; }
    return true;
  });
}

function summary(){
  const ym = new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Bangkok"}).slice(0,7);
  const m = rows.filter(r=>r.date_from.startsWith(ym) && r.status!=="rejected" && r.status!=="cancelled");
  const byType={}, byDept={};
  m.forEach(r=>{ byType[r.leave_type]=(byType[r.leave_type]||0)+1; const d=r.department||"-"; byDept[d]=(byDept[d]||0)+1; });
  const mk = (obj,h1) => `<div class="card" style="flex:1;min-width:280px"><table style="min-width:0">
    <thead><tr><th>${h1}</th><th style="text-align:right">จำนวน</th></tr></thead>
    <tbody>${Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right;font-weight:700">${v}</td></tr>`).join("")||'<tr><td colspan="2" class="empty">ไม่มีข้อมูล</td></tr>'}</tbody>
  </table></div>`;
  return `<div class="count">เดือนนี้ (ไม่นับที่ไม่อนุมัติ): <b>${m.length}</b> รายการ</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap">${mk(byType,"แยกตามประเภท")}${mk(byDept,"แยกตามแผนก")}</div>`;
}

function render(){
  const c = document.getElementById("content");
  const k = kpis();
  if(tab==="pending"){
    const list = rows.filter(r=>r.status!=="cancelled" && (r.status==="pending" || !r.hr_ack_at));
    c.innerHTML = k + `<div class="count">รายการคงค้างที่ต้องดำเนินการ • กดปุ่มในตารางเพื่อจัดการแทนได้ (ไม่ส่งแจ้งเตือน LINE)</div>` + table(list,"act");
  } else if(tab==="all"){
    const list = applyFilter(rows);
    c.innerHTML = k + filterBar() + `<div class="count">แสดง ${list.length} จาก ${rows.length} รายการ • 🗑 ลบไฟล์แนบ/ลบคำขอได้จากคอลัมน์จัดการ</div>` + table(list,"del");
  } else if(tab==="users"){
    c.innerHTML = usersView(); // k ถูกคำนวณด้านบนแล้ว (อัปเดต badge)
  } else {
    c.innerHTML = k + summary();
  }
}

function exportExcel(){
  const list = tab==="all" ? applyFilter(rows) : rows;
  const data = list.map(r=>({ "ID":r.id, "รหัสพนักงาน":r.emp_code, "ชื่อ":r.emp_name, "แผนก":r.department||"",
    "ประเภท":r.leave_type, "ตั้งแต่":thD(r.date_from), "ถึง":thD(r.date_to), "ช่วง":r.day_part||"เต็มวัน", "เหตุผล":r.reason||"",
    "เอกสารแนบ":r.has_document?"มี":"ไม่มี", "จำนวนไฟล์":(r.attachments||[]).length, "สถานะ":stage(r), "ผู้อนุมัติ":r.approved_by||"",
    "HR รับทราบโดย":r.hr_ack_by||"", "ข้อความต้นฉบับ":r.raw_message||"" }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = [{wch:5},{wch:12},{wch:22},{wch:14},{wch:10},{wch:10},{wch:10},{wch:9},{wch:24},{wch:9},{wch:18},{wch:14},{wch:14},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "คำขอลา");
  const d = new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Bangkok"}).replaceAll("-","");
  XLSX.writeFile(wb, `leave_requests_${d}.xlsx`);
  toast("Export เรียบร้อย 📥");
}

/* ---------- Auth (login ร่วมกับ Portal) ---------- */
db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $g = id => document.getElementById(id);

let liveStarted = false, liveTimer = null;
function queueReload(){ clearTimeout(liveTimer); liveTimer = setTimeout(loadAll, 600); }
function startLive(){
  if(liveStarted) return; liveStarted = true;
  // Realtime: ข้อมูลเปลี่ยนใน DB -> หน้าเว็บอัปเดตทันที
  try{
    db.channel("live-hr")
      .on("postgres_changes", {event:"*", schema:"public", table:"leave_requests"}, queueReload)
      .on("postgres_changes", {event:"*", schema:"public", table:"registration_requests"}, queueReload)
      .on("postgres_changes", {event:"*", schema:"public", table:"line_users"}, queueReload)
      .subscribe();
  }catch(e){ console.error("realtime error:", e); }
  // Fallback: รีเฟรชเองทุก 60 วิ + ตอนสลับกลับมาที่แท็บ
  setInterval(()=>{ if(!document.hidden) loadAll(); }, 60000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) loadAll(); });
}

function unlock(){
  $g("authGate").classList.add("hide");
  document.body.classList.remove("locked");
  loadAll();
  startLive();
}
async function doLogin(){
  const btn = $g("authLoginBtn"), err = $g("authErr");
  err.classList.add("hide");
  btn.disabled = true; btn.textContent = "กำลังเข้าสู่ระบบ...";
  try{
    const { error } = await db.auth.signInWithPassword({
      email: $g("authEmail").value.trim(),
      password: $g("authPass").value,
    });
    if(error) throw error;
    unlock();
  }catch(e){
    err.textContent = "เข้าสู่ระบบไม่สำเร็จ: " + (e.message || e);
    err.classList.remove("hide");
  }finally{
    btn.disabled = false; btn.textContent = "เข้าสู่ระบบ";
  }
}
$g("authLoginBtn").onclick = doLogin;
$g("authPass").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
$g("mSave").onclick = saveEmp;

(async function bootAuth(){
  try{
    const { data:{ session } } = await db.auth.getSession();
    if(session) unlock();
  }catch(e){ /* คงหน้า login ไว้ */ }
})();
</script>
